lovelace:
  resources:
    - url: /local/zen-dots.css
      type: css

homeassistant:
  packages: !include_dir_named packages

# The optional test-mode package (packages/a290_test.yaml) is self-contained — it brings its own
# helpers, display sensors, panel timers and driver automation, all prefixed `a290_test_*`. The
# templates/ dir holds only the pretty-location sensor. (Car data comes from the Alpine A290
# add-on; there are no scripts, shell_commands or command_line sensors.)
template: !include_dir_merge_list templates
