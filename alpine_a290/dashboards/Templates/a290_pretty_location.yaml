##### Alpine A290 Pretty Location #####
#
# Human-readable location for the dashboard's LOCATION tile (sensor.alpine_pretty_location),
# derived from device_tracker.alpine_a290_location: "Driveway" inside zone.driveway, "Home"
# inside zone.home, otherwise the town from the optional `places` sensor (sensor.a290).

# METRIC ONLY: distance() returns kilometres and a zone radius is in metres, so the `* 1000`
# converts. On an imperial system it returns miles: change both factors to 1609.344. Templates
# cannot read the unit system, so this cannot self-detect.

# Optional: zone.driveway (else that branch is skipped) and sensor.a290 from the `places`
# integration (rename to your own, or remove for coordinates only).
- sensor:
    - name: "Alpine Pretty Location"
      unique_id: alpine_pretty_location
      state: "{% set lat = state_attr('device_tracker.alpine_a290_location','latitude') %}{% set lon = state_attr('device_tracker.alpine_a290_location','longitude') %}{% if lat is none or lon is none %}Unknown{% else %}{% set dd = distance(lat, lon, state_attr('zone.driveway','latitude'), state_attr('zone.driveway','longitude')) %}{% set hd = distance(lat, lon, state_attr('zone.home','latitude'), state_attr('zone.home','longitude')) %}{% if dd is not none and (dd * 1000) <= (state_attr('zone.driveway','radius') | float(0)) %}Driveway{% elif hd is not none and (hd * 1000) <= (state_attr('zone.home','radius') | float(0)) %}Home{% else %}{{ state_attr('sensor.a290','postal_town') or state_attr('sensor.a290','neighbourhood') or state_attr('sensor.a290','city') or (states('sensor.a290') if states('sensor.a290') not in ['unknown','unavailable',''] else 'Away') }}{% endif %}{% endif %}"
