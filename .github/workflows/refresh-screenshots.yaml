---
name: Screenshot drift

# Reports when the rendered dashboards no longer match the committed documentation screenshots,
# and hands you the regenerated ones as an artifact. It does NOT write to the branch.
#
# It used to. The old job committed refreshed PNGs straight to the PR head via a GitHub App
# token, and that created a race with whoever was working on the PR:
#
#   push -> UI Tests -> render differs -> bot commits -> head moves -> your push is rejected
#   (non-fast-forward), or the CLEAN verdict you just read is invalidated and the merge refused
#
# In one session on 2026-09-07 that rejected three pushes, twice mid-merge, and moved the head
# five times across the two repos. The `[refresh-shots]` guard only stops the bot re-triggering
# ITSELF; it does nothing about a human merging that commit and pushing again. CI writing to a
# branch a human is working on is the race — so CI no longer writes to it.
#
# Why report rather than FAIL on drift (the gate the a290/r5 twin of gotoad's `Screenshot drift
# gate` would be): the render is not yet reproducible. Two consecutive runs of the same code
# against the same seed produced 10 of 30 screenshots differing, two of them at different page
# DIMENSIONS (724x5454 vs 734x5002) — cards still land after capture, so `full_page` grabs a
# different-height document. A hard gate over that would be permanently red. Freezing the
# animations and anchoring the seeded timestamps fixed the fast oscillation; the remaining
# layout settling has to be solved before this can become a required check.

on:
  workflow_run:
    workflows: ["UI Tests"]
    types: [completed]

permissions:
  actions: read     # download the render artifact from the triggering run
  contents: read    # NOTE: read only. Nothing here writes to a branch any more.

jobs:
  drift:
    name: Screenshot drift
    runs-on: ubuntu-latest
    # Same-repo PRs only (forks cannot produce a trustworthy render), and only when the render
    # actually succeeded — a failed render says nothing about drift.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      # Default ref = the default branch (trusted): main's copy of the resize step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download rendered screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dashboard-screenshots
          path: ui-tests/screenshots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      # The render artifact is PR-controlled data, so Pillow decodes attacker-influenced PNGs
      # here. There is no longer any write credential in this workflow for such an exploit to
      # reach — the App token and its contents:write scope are gone entirely.
      - name: Copy + resize the phone shots
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "pillow==12.2.0"
          cp ui-tests/screenshots/alpine-standard__iphone_15_pro.png docs/screenshots/standard-iphone-15-pro.png
          cp ui-tests/screenshots/alpine-standard__galaxy_s24.png docs/screenshots/standard-galaxy-s24.png
          cp ui-tests/screenshots/alpine-bubble__iphone_15_pro.png docs/screenshots/bubble-iphone-15-pro.png
          cp ui-tests/screenshots/alpine-bubble__galaxy_s24.png docs/screenshots/bubble-galaxy-s24.png
          cp ui-tests/screenshots/alpine-bubble__smart_charging__iphone_15_pro.png docs/screenshots/smart-charging-iphone-15-pro.png
          python3 -c "
          from PIL import Image
          for f in ['standard-iphone-15-pro.png', 'standard-galaxy-s24.png']:
              p = 'docs/screenshots/' + f
              im = Image.open(p)
              if im.width > 700:
                  im.resize((700, round(im.height * 700 / im.width))).save(p)
          "
      - name: Report drift (never fails the build — see the header)
        id: drift
        run: |
          # Porcelain, not `git diff`, so an ADDED or REMOVED shot is reported too.
          drift="$(git status --porcelain -- docs/screenshots/)"
          if [ -n "$drift" ]; then
            {
              echo "### Documentation screenshots drifted"
              echo
              echo '```'
              echo "$drift"
              echo '```'
              echo
              echo "Regenerated screenshots are attached to this run as **regenerated-screenshots**."
              echo "Download and commit them yourself if the change is real."
              echo
              echo "This does not fail the build, and nothing was committed to your branch."
              echo "The render is not yet reproducible — two runs of identical code differ — so"
              echo "drift here is not proof that anything actually changed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "drifted=1" >> "$GITHUB_OUTPUT"
          else
            echo "Screenshots match the committed documentation." >> "$GITHUB_STEP_SUMMARY"
            echo "drifted=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the regenerated screenshots
        if: steps.drift.outputs.drifted == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: regenerated-screenshots
          path: docs/screenshots/
          retention-days: 7
