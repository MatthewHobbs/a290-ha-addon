name: Release tag

# A release is a signed tag I push after the release PR merges (ADR 0007). This workflow
# only checks it and cuts the GitHub Release; it never creates the tag, because a tag
# made from a workflow is unsigned and shows no verified tick.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Cut the GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tag is annotated, signed and verified
        run: |
          set -euo pipefail
          ref="$(gh api "repos/${REPO}/git/ref/tags/${TAG}")"
          # A lightweight tag points at the commit and cannot carry a signature.
          [[ "$(jq -r .object.type <<<"$ref")" == tag ]] ||
            { echo "::error::${TAG} is a lightweight tag; create it with git tag -s"; exit 1; }
          obj="$(jq -r .object.sha <<<"$ref")"
          gh api "repos/${REPO}/git/tags/${obj}" --jq .verification.verified | grep -qx true ||
            { echo "::error::${TAG} is not a verified signed tag"; exit 1; }

      - name: The tag is on main and names config.yaml's version
        run: |
          set -euo pipefail
          # An image built from a commit that never landed would ship code nobody merged.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::${TAG} is not on main"; exit 1; }
          version="$(awk -F'"' '/^version:/{print $2}' alpine_a290/config.yaml)"
          [[ "${TAG}" == "v${version}" ]] ||
            { echo "::error::${TAG} does not match config.yaml version ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: The image is published and attested from main
        run: |
          set -euo pipefail
          image="$(awk '/^image:/{print $2}' alpine_a290/config.yaml)"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          docker buildx imagetools inspect "${image}:${VERSION}" >/dev/null
          gh attestation verify "oci://${image}:${VERSION}" --owner "${GITHUB_REPOSITORY_OWNER}"

      - name: CI and the UI gate are green on this commit (ADR 0005)
        # A pending check fails this step; re-run the job once it has finished.
        run: |
          set -euo pipefail
          runs="$(gh api --paginate "repos/${REPO}/commits/${GITHUB_SHA}/check-runs" \
            --jq '.check_runs[] | {name, conclusion}' | jq -s .)"
          for pattern in '^(Lint|Tests|Security|Build \(amd64 sanity\)|Docs sync)$' '^Dashboard responsive render'; do
            jq -e --arg p "$pattern" '[.[] | select(.name | test($p))]
              | length > 0 and all(.conclusion | IN("success", "skipped", "neutral"))' <<<"$runs" >/dev/null ||
              { echo "::error::no green check matching ${pattern} on ${GITHUB_SHA}"; exit 1; }
          done

      - name: Create the Release when new
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, nothing to do."
            exit 0
          fi
          gh release create "${TAG}" --repo "${REPO}" --verify-tag --title "${TAG}" \
            --notes "Multi-arch image published: \`${IMAGE}:${VERSION}\`, build provenance attested (keyless, GitHub OIDC) and pushed to the registry. Verify: \`gh attestation verify oci://${IMAGE}:${VERSION} --owner ${GITHUB_REPOSITORY_OWNER}\`."
