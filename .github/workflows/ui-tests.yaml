name: UI Tests

# Renders the bundled dashboards in a real Home Assistant across the top mobile device
# sizes and fails on text truncation / broken cards. Path-filtered so it only runs when a
# rendering input changes — the dashboards, the deploy-time card injection (app/deploy.py),
# or the harness itself.
on:
  push:
    branches: [main]
    paths:
      - 'alpine_a290/dashboards/**'
      # ...but NOT the prose in there. USER-GUIDE.md / INSTALLATION.md are user documentation;
      # they cannot change what renders, yet a one-line edit to either used to trigger the full
      # ten-viewport render AND the screenshot auto-refresh, which commits PNGs to the PR branch
      # — twice rejecting an in-flight merge on #115 and committing a shot that changed 62% in
      # size for a markdown-only edit. Everything else under dashboards/ (the .txt card configs,
      # CSS, Fonts, Images, Packages, Templates) genuinely affects the render and still triggers.
      # Both patterns deliberately: the two .md files sit directly in dashboards/, and whether
      # `**/` matches zero directories is exactly the kind of assumption that ships a filter
      # which silently changes nothing. The first line is the one that does the work today; the
      # second covers any doc added in a subdirectory later.
      - '!alpine_a290/dashboards/*.md'
      - '!alpine_a290/dashboards/**/*.md'
      - 'alpine_a290/app/deploy.py'
      - 'alpine_a290/config.yaml'
      - 'ui-tests/**'
      - '.github/workflows/ui-tests.yaml'
  pull_request:
    paths:
      - 'alpine_a290/dashboards/**'
      # ...but NOT the prose in there. USER-GUIDE.md / INSTALLATION.md are user documentation;
      # they cannot change what renders, yet a one-line edit to either used to trigger the full
      # ten-viewport render AND the screenshot auto-refresh, which commits PNGs to the PR branch
      # — twice rejecting an in-flight merge on #115 and committing a shot that changed 62% in
      # size for a markdown-only edit. Everything else under dashboards/ (the .txt card configs,
      # CSS, Fonts, Images, Packages, Templates) genuinely affects the render and still triggers.
      # Both patterns deliberately: the two .md files sit directly in dashboards/, and whether
      # `**/` matches zero directories is exactly the kind of assumption that ships a filter
      # which silently changes nothing. The first line is the one that does the work today; the
      # second covers any doc added in a subdirectory later.
      - '!alpine_a290/dashboards/*.md'
      - '!alpine_a290/dashboards/**/*.md'
      - 'alpine_a290/app/deploy.py'
      - 'alpine_a290/config.yaml'
      - 'ui-tests/**'
      - '.github/workflows/ui-tests.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    name: Dashboard responsive render (mobile matrix, ${{ matrix.leg }})
    runs-on: ubuntu-latest
    # Both ends of the supported range (global rule): the Renovate-tracked stable pin in run.sh,
    # and the declared minimum, read from config.yaml so the test cannot drift from the claim.
    strategy:
      fail-fast: false
      matrix:
        leg: [stable, minimum]
    steps:
      # Default checkout: for a PR this renders the merge ref (the PR's dashboard/deploy.py
      # changes). This job holds NO secrets — committing the refreshed screenshots back to the
      # PR branch is done by the separate, trusted "Refresh screenshots" workflow (workflow_run),
      # which never runs the PR's code with the PAT.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Match the add-on runtime (HA base 3.24 → Python 3.14); the harness imports app/deploy.py.
          python-version: "3.14"

      - name: Install deps (aiohttp + PyYAML + Playwright/Chromium + Pillow)
        run: |
          python3 -m pip install --quiet aiohttp PyYAML playwright pillow
          python3 -m playwright install --with-deps chromium

      - name: Pick the Home Assistant image for this leg
        id: ha
        run: |
          # A stable pin behind current stable means this leg is not testing what users run.
          # Renovate proposes the bump; until it merges, say so visibly rather than failing every PR.
          if [ "${{ matrix.leg }}" = stable ]; then
            pin="$(sed -n 's/^HA_IMAGE=.*home-assistant:\([0-9][0-9.]*\)}.*/\1/p' ui-tests/run.sh)"
            cur="$(curl -fsS -A 'ha-minimum-check (MatthewHobbs HA add-ons)' https://version.home-assistant.io/stable.json \
                   | python3 -c 'import sys,json;print(json.load(sys.stdin)["homeassistant"]["default"])')"
            [ -n "$pin" ] && [ -n "$cur" ] || { echo "::error::could not read the pin or current stable"; exit 1; }
            [ "$pin" = "$cur" ] || echo "::warning::UI gate stable pin $pin is behind current stable $cur - merge the Renovate 'UI gate render inputs' PR"
            echo "stable leg: pin $pin, current stable $cur"
          fi
          if [ "${{ matrix.leg }}" = minimum ]; then
            v="$(sed -n 's/^homeassistant: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}.*/\1/p' alpine_a290/config.yaml)"
            [ -n "$v" ] || { echo "::error::no homeassistant: minimum in alpine_a290/config.yaml"; exit 1; }
            echo "image=ghcr.io/home-assistant/home-assistant:$v" >> "$GITHUB_OUTPUT"
          fi
      - name: Render dashboards across the mobile device matrix
        env:
          UI_TESTS_DARK: "1"   # render dark (the truncation gate is colour-agnostic)
          HA_IMAGE: ${{ steps.ha.outputs.image }}   # empty on the stable leg: run.sh keeps its pin
        run: bash ui-tests/run.sh

      # The refreshed docs screenshots are committed by the separate "Refresh screenshots"
      # workflow (refresh-screenshots.yaml), which downloads this artifact. Uploaded always so
      # a failed render still surfaces the partial shots for debugging.
      - name: Upload device screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Screenshot drift reads the stable leg's artifact by this exact name.
          name: ${{ matrix.leg == 'stable' && 'dashboard-screenshots' || 'dashboard-screenshots-minimum' }}
          path: ui-tests/screenshots/
          if-no-files-found: warn
