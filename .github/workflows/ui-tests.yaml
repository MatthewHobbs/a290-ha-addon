name: UI Tests

# Renders the bundled dashboards in a real Home Assistant on mobile sizes
# and fails on truncation or broken cards.
# Triggers unconditionally so the render check-run always exists: a required check
# on a workflow that never starts stays "Expected" and blocks merges. `changes`
# decides relevance; skipped steps still report green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Decide whether this touches the render
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The minimum leg renders only for a release, a change to the declared minimum
      # (`homeassistant:` reaches users on merge), or on demand. A base that cannot be read
      # counts as a release, so the doubt costs a render, never the test.
      - name: Is this a release?
        id: release
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          release=false
          if [ "$EVENT" = workflow_dispatch ]; then
            release=true
          elif [[ "$TITLE" == "chore(release):"* ]]; then
            release=true
          elif ! git fetch --quiet --depth=1 origin "$BASE" \
               || ! base="$(git show FETCH_HEAD:alpine_a290/config.yaml | grep -E '^(version|homeassistant):')"; then
            echo "::warning::could not read config.yaml version at base $BASE; rendering the minimum leg"
            release=true
          elif [ "$base" != "$(grep -E '^(version|homeassistant):' alpine_a290/config.yaml)" ]; then
            release=true
          fi
          echo "release=$release" | tee -a "$GITHUB_OUTPUT"

      # Same patterns the trigger-level `paths:` filter used while the job could be skipped, so the
      # workflow itself can always start (see the header comment) while still skipping the
      # expensive render when nothing relevant changed.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            relevant:
              - 'alpine_a290/dashboards/**'
              # ...but NOT the prose: those .md files cannot change what renders, and a
              # markdown edit used to run the full render and screenshot refresh, twice
              # rejecting an in-flight merge (#115). Everything else under dashboards/
              # affects the render. Both patterns: `**/` matching zero directories is
              # not assumed.
              - '!alpine_a290/dashboards/*.md'
              - '!alpine_a290/dashboards/**/*.md'
              - 'alpine_a290/app/deploy.py'
              - 'alpine_a290/app/catalog.py'   # the alarm pass derives its sensors from it
              - 'alpine_a290/config.yaml'
              - 'ui-tests/**'
              - '.github/workflows/ui-tests.yaml'

  responsive:
    name: Dashboard responsive render (mobile matrix, ${{ matrix.leg }})
    needs: [changes]
    runs-on: ubuntu-latest
    # Both ends of the supported range (global rule): the hand-bumped stable pin in run.sh,
    # and the declared minimum, read from config.yaml so the test cannot drift from the claim.
    strategy:
      fail-fast: false
      matrix:
        leg: [stable, minimum]
    # Off, the leg still runs and reports success under its own name (the required check),
    # only with every step skipped; see the note below.
    env:
      RENDER: ${{ github.event_name == 'workflow_dispatch' || (needs.changes.outputs.relevant == 'true' && (matrix.leg == 'stable' || needs.changes.outputs.release == 'true')) }}
    steps:
      # Default checkout: for a PR this renders the merge ref (the PR's dashboard/deploy.py
      # changes). This job holds NO secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The `if:` lives on these steps, not the job: a job-level `if:` that is false
      # stops a matrix expanding, so one check-run appears under the raw template name
      # instead of the two ("stable", "minimum") the required checks name — leaving both
      # "Expected" forever.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: env.RENDER == 'true'
        with:
          # Match the add-on runtime (HA base 3.24 → Python 3.14); the harness imports app/deploy.py.
          python-version: "3.14"

      - name: Install deps (runtime lock + Playwright/Chromium)
        if: env.RENDER == 'true'
        run: |
          python3 -m pip install --quiet -r alpine_a290/app/requirements.txt
          python3 -m pip install --quiet playwright==1.64.0
          python3 -m playwright install --with-deps chromium

      - name: Pick the Home Assistant image for this leg
        id: ha
        if: env.RENDER == 'true'
        run: |
          # A stable pin behind current stable means this leg is not testing what users run.
          # Bumping the pin is a manual step; until it happens, say so visibly rather than fail every PR.
          if [ "${{ matrix.leg }}" = stable ]; then
            pin="$(sed -n 's/^HA_IMAGE=.*home-assistant:\([0-9][0-9.]*\)}.*/\1/p' ui-tests/run.sh)"
            cur="$(curl -fsS -A 'ha-minimum-check (MatthewHobbs HA add-ons)' https://version.home-assistant.io/stable.json \
                   | python3 -c 'import sys,json;print(json.load(sys.stdin)["homeassistant"]["default"])')"
            [ -n "$pin" ] && [ -n "$cur" ] || { echo "::error::could not read the pin or current stable"; exit 1; }
            [ "$pin" = "$cur" ] || echo "::warning::UI gate stable pin $pin is behind current stable $cur - bump it in ui-tests/run.sh with the card pins"
            echo "stable leg: pin $pin, current stable $cur"
          fi
          if [ "${{ matrix.leg }}" = minimum ]; then
            v="$(sed -n 's/^homeassistant: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}.*/\1/p' alpine_a290/config.yaml)"
            [ -n "$v" ] || { echo "::error::no homeassistant: minimum in alpine_a290/config.yaml"; exit 1; }
            echo "image=ghcr.io/home-assistant/home-assistant:$v" >> "$GITHUB_OUTPUT"
          fi
      - name: Render dashboards across the mobile device matrix
        if: env.RENDER == 'true'
        env:
          UI_TESTS_DARK: "1"   # render dark (the truncation gate is colour-agnostic)
          HA_IMAGE: ${{ steps.ha.outputs.image }}   # empty on the stable leg: run.sh keeps its pin
        run: bash ui-tests/run.sh

      # For comparing with docs/screenshots/ by hand. Uploaded whenever a render was
      # attempted (`always()`), skipped on a no-op run so a non-dashboard PR gets no
      # spurious "no files found" warning.
      - name: Upload device screenshots
        if: always() && env.RENDER == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.leg == 'stable' && 'dashboard-screenshots' || 'dashboard-screenshots-minimum' }}
          path: ui-tests/screenshots/
          if-no-files-found: warn
