name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled so adding (or removing) the docs-sync-ok waiver re-runs the gate —
    # otherwise a red required check stays red until an unrelated push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3.1.1
        with:
          file_or_dir: alpine_a290 repository.yaml
          config_file: .yamllint

      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: alpine_a290/Dockerfile
          config: .hadolint.yaml

      - name: ShellCheck (run.sh)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          scandir: alpine_a290
          additional_files: run.sh

      - name: ShellCheck (scripts)
        run: shellcheck scripts/supervisor-pilot.sh scripts/check-version-order.sh scripts/test-check-version-order.sh

      - name: Ruff (Python)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version: "0.17.1"
          src: alpine_a290/app alpine_a290/tests scripts ui-tests

      - name: Home Assistant add-on linter
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7  # v2.21.1
        with:
          path: ./alpine_a290

      # AppArmor is enforced by the Supervisor, not by a local docker run or the build job —
      # so a malformed/over-tight profile can break startup without any other job noticing.
      # Compile it here with the real parser to catch syntax errors before release.
      - name: AppArmor profile compiles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apparmor
          apparmor_parser -Q -K alpine_a290/apparmor.txt
          echo "apparmor.txt compiled OK"

      # Global rule: the declared minimum HA must exist and be no newer than the .1 of
      # the month before current stable, read live (a fixed bound rots). It must also be
      # a published PyPI release; an unreachable PyPI fails the step.
      - name: Home Assistant minimum is declared and allowed
        run: |
          python3 scripts/ha_minimum_check.py --self-test
          python3 scripts/ha_minimum_check.py alpine_a290/config.yaml

  docs-sync:
    name: Docs sync
    runs-on: ubuntu-latest
    # After lint, deliberately: a doc-sync verdict is noise while the code does not
    # lint, and `needs` skips this rather than queueing a runner for it.
    needs: [lint]
    # PR-only: the check diffs base...HEAD, and a push to main has no pull_request payload.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # diffs base...HEAD and reads the base tree
      - name: Documentation must track options, entities and version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python3 -m pip install --quiet -r alpine_a290/app/requirements.txt
          python3 scripts/docs_sync_check.py --self-test
          python3 scripts/prepare_release.py --self-test
          python3 scripts/adr_evidence_check.py --self-test
          scripts/test-check-version-order.sh
          python3 scripts/docs_sync_check.py "$BASE_SHA"
          python3 scripts/adr_evidence_check.py

  parity:
    name: Parity with r5
    runs-on: ubuntu-latest
    # Fail on any difference from r5 that expected.tsv does not explain, and on any
    # entry whose difference is gone. It reads r5's main as it is now, so r5 can turn
    # this red without a change here — hence its own, not-yet-required job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check out r5-ha-addon main (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: MatthewHobbs/r5-ha-addon
          ref: main
          path: .parity-twin
          persist-credentials: false
      - name: Parity check can fail
        run: python3 scripts/parity_check.py --self-test
      - name: a290 and r5 differ only as listed
        run: python3 scripts/parity_check.py --twin .parity-twin

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Match the add-on runtime: HA base 3.24 ships Python 3.14 (apk python3).
          python-version: "3.14"

      - name: Install deps
        # requirements.txt is hash-pinned, so install app deps on their own, then the
        # unhashed test tooling and the core separately. The core SHA comes from the
        # Dockerfile's CORE_REF, so CI validates what the image ships; --no-deps
        # because its deps are already in the lock.
        run: |
          python3 -m pip install --quiet -r alpine_a290/app/requirements.txt
          python3 -m pip install --quiet pytest==9.1.1 pytest-cov==7.1.0
          CORE_REF="$(sed -n 's/^ARG CORE_REF=//p' alpine_a290/Dockerfile)"
          echo "renault-mqtt pinned to ${CORE_REF}"
          python3 -m pip install --quiet --no-deps \
            "renault-mqtt @ git+https://github.com/MatthewHobbs/renault-mqtt@${CORE_REF}"

      - name: pytest
        run: python3 -m pytest alpine_a290/tests -q --cov=alpine_a290/app --cov-report=term-missing --cov-fail-under=95

  comments:
    name: Comment length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.1.0
        with:
          python-version: "3.14"
      - run: python3 scripts/check_comment_length.py alpine_a290 scripts .github

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Bandit (Python SAST)
        run: |
          python3 -m pip install --quiet bandit==1.9.4
          bandit -r alpine_a290/app -ll

      - name: pip-audit (dependency CVEs)
        run: |
          python3 -m pip install --quiet pip-audit==2.10.1
          pip-audit -r alpine_a290/app/requirements.txt

      # gitleaks/trivy have no rule for a VIN or a home location, and both leaked here
      # (a VIN, #91; coordinates, 2026-09-08). Self-test first: a guard that cannot fail
      # is not a guard.
      - name: No committed PII (VINs, coordinates)
        run: |
          python3 scripts/pii_check.py --self-test
          python3 scripts/pii_check.py

      # Pinned action and Trivy version: piping trivy's install.sh from main to sh is how the
      # malicious v0.69.4 (CVE-2026-33634) reached runners.
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.76.0
      - name: Trivy filesystem scan (vulns, misconfig, secrets)
        run: |
          trivy fs --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .

  build:
    name: Build (amd64 sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # The base image is pinned in the Dockerfile (FROM ghcr.io/home-assistant/base:<tag>),
      # so no BUILD_FROM build-arg is needed.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./alpine_a290
          push: false
