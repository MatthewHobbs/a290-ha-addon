name: Release

# The bump PR publishes the image and the REQUIRED `Release image published` gate confirms it
# resolves before merge; the push to main rebuilds and attests. My signed tag then runs
# release-tag.yaml (ADR 0007). "Bump" = version changed AND tag absent (release_decision.py).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      pilot_matrix: ${{ steps.pilotmatrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      is_new: ${{ steps.newcheck.outputs.is_new }}
      version_changed: ${{ steps.newcheck.outputs.version_changed }}
      publish: ${{ steps.newcheck.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get add-on information
        id: info
        uses: home-assistant/actions/helpers/info@06749dd8c0b54f350bc69c8752456cee498808a3  # master
        with:
          path: "./alpine_a290"

      - name: Normalize add-on information
        id: normalize
        # Pass info-helper outputs via env (NOT inlined into the script): the description
        # contains parentheses and would otherwise break the shell parser.
        env:
          INFO_IMAGE: ${{ steps.info.outputs.image }}
          INFO_VERSION: ${{ steps.info.outputs.version }}
          INFO_NAME: ${{ steps.info.outputs.name }}
          INFO_DESCRIPTION: ${{ steps.info.outputs.description }}
          INFO_URL: ${{ steps.info.outputs.url }}
        run: |
          # The info helper preserves the literal quotes from quoted config.yaml scalars
          # (e.g. version: "1.4.7"), so strip them where the value flows into an image
          # reference / tag.
          image="${INFO_IMAGE//\"/}"
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${INFO_VERSION//\"/}" >> "$GITHUB_OUTPUT"
          echo "name=${INFO_NAME}" >> "$GITHUB_OUTPUT"
          echo "description=${INFO_DESCRIPTION}" >> "$GITHUB_OUTPUT"
          if [[ -n "$INFO_URL" && "$INFO_URL" != "null" ]]; then
            echo "url=${INFO_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the comparison base
        # The commit this change is measured against: the PR's base, or what main was before this
        # push. A second checkout, so the SAME helper that reads the version here reads it there.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          path: base
          persist-credentials: false

      - name: Get the base add-on information
        id: base_info
        uses: home-assistant/actions/helpers/info@06749dd8c0b54f350bc69c8752456cee498808a3  # master
        with:
          path: "./base/alpine_a290"

      - name: Is this a new version, and did this change move it?
        id: newcheck
        env:
          HEAD_VERSION: ${{ steps.normalize.outputs.version }}
          BASE_INFO_VERSION: ${{ steps.base_info.outputs.version }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag="v${HEAD_VERSION}"
          # Only exit 0 (found) and exit 2 (absent) are answers; anything else, such as a network
          # failure (128), is passed through and refused by the script rather than read as "absent".
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1
          TAG_RC=$?
          set -e
          export TAG_RC
          export BASE_VERSION="${BASE_INFO_VERSION//\"/}"
          if ! out="$(python3 scripts/release_decision.py)"; then
            echo "$out"
            exit 1
          fi
          echo "$out" | tee -a "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10  # 2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

      # The pilot's legs are the build matrix with both Core ends each, so the
      # published image names come from the same source the build pushes to.
      - name: Prepare the pilot matrix
        id: pilotmatrix
        env:
          BUILD_MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          matrix="$(jq -c '{include: [.include[] as $m | ("stable", "minimum") as $c | $m + {core: $c}]}' \
            <<<"$BUILD_MATRIX")"
          [[ "$(jq '.include | length' <<<"$matrix")" == 4 ]] ||
            { echo "::error::expected 4 pilot legs, got $(jq '.include | length' <<<"$matrix")"; exit 1; }
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write   # push to GHCR (per-arch images); attestation happens in `manifest`
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The base image is pinned in the Dockerfile (FROM ghcr.io/home-assistant/base:<tag>, a
      # multi-arch image), so no BUILD_FROM build-arg / build.yaml is needed — the builder picks
      # the right platform per matrix arch.
      - name: Build image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10  # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
          # Disable the builder's keyless Cosign signing. It defaults on and needs
          # `id-token: write`, which this job deliberately does NOT grant (provenance is attested
          # in the `manifest` job, the single source of image verification). Left enabled it
          # fails `cosign sign` with `expired_token` and takes the whole release down.
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./alpine_a290"
          image: ${{ matrix.image }}
          # Only the immutable version tag — no mutable `latest`. A mid-matrix failure would
          # leave `latest` pointing at mixed-version arches; Supervisor resolves the add-on
          # image by config.yaml `version`, never by `latest`.
          image-tags: |
            ${{ needs.prepare.outputs.version }}
          labels: |
            io.hass.type=addon
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          # Push a new version's image on BOTH the merge (push to main) and the same-repo PR that
          # bumps it — the PR push is what makes `<image>:<version>` exist before merge, closing
          # the phantom-version window. Fork PRs can't write to GHCR, so they build only.
          push: ${{ needs.prepare.outputs.publish == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    # Publish the multi-arch index on the merge AND on the same-repo version-bump PR (so the
    # image exists before merge). The attestation + tag steps below stay main-only.
    if: ${{ needs.prepare.outputs.publish == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # OIDC token for keyless build-provenance attestation (push to main)
      packages: write      # push the multi-arch manifest + the attestation to GHCR
      attestations: write  # publish the build-provenance attestation
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10  # 2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          # Disable the builder's Cosign manifest signing too — image verification is provided by
          # the build-provenance attestation below, not Cosign (see the build job).
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          # Version tag only — no mutable `latest` (see the build job for the rationale).
          image-tags: |
            ${{ needs.prepare.outputs.version }}
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}

      # build-image/publish-multi-arch-manifest expose no pushed digest, so resolve
      # the manifest-list digest from the registry and attest that: it is what a
      # Supervisor pulls for the tagless `image:` reference, and what a consumer
      # verifies.
      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Provenance is attested only from main (push), so the released image always traces to a
      # commit on main — never a pre-merge PR build (which is transient and gets overwritten by
      # the rebuild below).
      - name: Resolve published manifest digest
        id: digest
        if: ${{ github.event_name == 'push' }}
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Compute the index digest from its raw bytes: `--format
          # '{{.Manifest.Digest}}'` falls back to verbose output on this buildx.
          # Capture first, so a failed inspect cannot hash an empty stream and attest
          # that.
          raw="$(docker buildx imagetools inspect "$IMAGE_REF" --raw)"
          if [[ -z "$raw" ]]; then
            echo "::error::imagetools inspect returned no data for ${IMAGE_REF}"
            exit 1
          fi
          digest="sha256:$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve a valid digest for ${IMAGE_REF} (got '${digest}')"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved ${IMAGE_REF} → ${digest}"

      - name: Attest build provenance
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  pilot:
    name: Published image (${{ matrix.arch }}, Core ${{ matrix.core }})
    needs: [prepare, build]
    # ADR 0002 row 5: the artefact that ships is the one GHCR serves, booted under a
    # real stable Supervisor on both arches and both Core ends. Runs on the bump PR —
    # which is where the image is published — so a merge cannot ship an unbooted one.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.pilot_matrix) }}
    env:
      CORE_VERSION: ${{ matrix.core }}
      PILOT_KEEP: "1"
      PILOT_IMAGE: ${{ matrix.image }}:${{ needs.prepare.outputs.version }}
      # Condition on the steps, not the job: a false job-level `if:` stops the
      # matrix expanding, so the legs report under an unexpanded template name
      # (ui-tests.yaml, ADR 0005). A fork bump PR cannot push, so it has no image.
      PILOT_RUN: ${{ needs.prepare.outputs.publish == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      # The PR head, not the merge ref: the image was built from this commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.PILOT_RUN == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install the published image under the stable Supervisor
        if: env.PILOT_RUN == 'true'
        env:
          PILOT_WORKDIR: ${{ runner.temp }}/pilot
        run: scripts/supervisor-pilot.sh all

      - name: Collect diagnostics
        if: failure() && env.PILOT_RUN == 'true'
        env:
          PILOT_WORKDIR: ${{ runner.temp }}/pilot
        run: scripts/supervisor-pilot.sh diagnostics "$PILOT_WORKDIR/diagnostics"

      - name: Upload diagnostics
        if: failure() && env.PILOT_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-pilot-${{ matrix.arch }}-${{ matrix.core }}
          path: ${{ runner.temp }}/pilot/diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always() && env.PILOT_RUN == 'true'
        run: scripts/supervisor-pilot.sh down

  release-gate:
    name: Release image published
    # The merge gate, and a REQUIRED check: a bump PR cannot merge until its image
    # resolves on GHCR. Runs on every PR and always reports, so it never leaves a
    # required check pending; `always()` so it evaluates when build/manifest skipped.
    needs: [prepare, build, manifest]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the image exists before merge
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          IMAGE_REF: ${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.version }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          MANIFEST_RESULT: ${{ needs.manifest.result }}
        run: |
          set -euo pipefail
          # Fail CLOSED. This job uses always(), so it also runs when prepare/build failed — in
          # which case PUBLISH is empty and must NOT be read as a safe "no bump". If we can't
          # determine or trust the release state, block the merge rather than wave it through.
          if [[ "$PREPARE_RESULT" != "success" ]]; then
            echo "::error::prepare did not succeed ($PREPARE_RESULT) — cannot determine whether this is a version bump; blocking merge."
            exit 1
          fi
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "::error::the image build did not succeed ($BUILD_RESULT); blocking merge."
            exit 1
          fi
          if [[ "$PUBLISH" != "true" ]]; then
            echo "Nothing to publish — this change does not move the version to an unreleased one. Merge is safe."
            exit 0
          fi
          if [[ "$SAME_REPO" != "true" ]]; then
            echo "::error::This PR bumps the version but comes from a fork, which cannot publish to GHCR. Re-run the bump from a branch in this repository so the image is published before merge."
            exit 1
          fi
          if [[ "$MANIFEST_RESULT" != "success" ]]; then
            echo "::error::Version is new but the manifest was not published (manifest=$MANIFEST_RESULT). Merging would advertise a version with no image."
            exit 1
          fi
          # Belt-and-suspenders: the tag must actually resolve on the registry now.
          docker buildx imagetools inspect "$IMAGE_REF" >/dev/null
          echo "Image ${IMAGE_REF} is published and pullable — merging will not 404."
