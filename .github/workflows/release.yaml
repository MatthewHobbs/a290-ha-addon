name: Release

# A signed v* tag pushed after the release PR merges. The tag run builds, scans each arch
# by digest, boots it under the Supervisor, waits for CI, attests the staged manifest, then
# publishes the version tag and cuts the Release. A PR or dispatch is a local dry run.

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      pilot_matrix: ${{ steps.pilotmatrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the on-main and version-order checks need history and every tag

      - name: Get add-on information
        id: info
        uses: home-assistant/actions/helpers/info@86d4564712fa02543c808e3a693dd04f9d3f8361  # master
        with:
          path: "./alpine_a290"

      - name: Normalize add-on information
        id: normalize
        # Pass info-helper outputs via env (NOT inlined into the script): the description
        # contains parentheses and would otherwise break the shell parser.
        env:
          INFO_IMAGE: ${{ steps.info.outputs.image }}
          INFO_VERSION: ${{ steps.info.outputs.version }}
          INFO_NAME: ${{ steps.info.outputs.name }}
          INFO_DESCRIPTION: ${{ steps.info.outputs.description }}
          INFO_URL: ${{ steps.info.outputs.url }}
        run: |
          # The info helper preserves the literal quotes from quoted config.yaml scalars
          # (e.g. version: "1.4.7"), so strip them where the value flows into an image
          # reference / tag.
          image="${INFO_IMAGE//\"/}"
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${INFO_VERSION//\"/}" >> "$GITHUB_OUTPUT"
          echo "name=${INFO_NAME}" >> "$GITHUB_OUTPUT"
          echo "description=${INFO_DESCRIPTION}" >> "$GITHUB_OUTPUT"
          if [[ -n "$INFO_URL" && "$INFO_URL" != "null" ]]; then
            echo "url=${INFO_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether this run publishes, and check the tag if so
        id: decide
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != push || "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Not a tag push: a dry run, nothing is pushed."
            exit 0
          fi
          [[ "$GITHUB_REF" == "refs/tags/v${VERSION}" ]] ||
            { echo "::error::${GITHUB_REF} does not match config.yaml version ${VERSION}"; exit 1; }
          ref="$(gh api "repos/${REPO}/git/ref/tags/v${VERSION}")"
          # A lightweight tag points at the commit and cannot carry a signature.
          [[ "$(jq -r .object.type <<<"$ref")" == tag ]] ||
            { echo "::error::v${VERSION} is a lightweight tag; create it with git tag -s"; exit 1; }
          gh api "repos/${REPO}/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .verification.verified |
            grep -qx true || { echo "::error::v${VERSION} is not a verified signed tag"; exit 1; }
          # An image built from a commit that never landed would ship code nobody merged.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::v${VERSION} is not on main"; exit 1; }
          git tag -l 'v*' | scripts/check-version-order.sh "$VERSION"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a  # 2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

      # The pilot's legs are the build matrix with both Core ends each, so the
      # published image names come from the same source the build pushes to.
      - name: Prepare the pilot matrix
        id: pilotmatrix
        env:
          BUILD_MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          matrix="$(jq -c '{include: [.include[] as $m | ("stable", "minimum") as $c | $m + {core: $c}]}' \
            <<<"$BUILD_MATRIX")"
          [[ "$(jq '.include | length' <<<"$matrix")" == 4 ]] ||
            { echo "::error::expected 4 pilot legs, got $(jq '.include | length' <<<"$matrix")"; exit 1; }
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write   # push to GHCR (per-arch images); attestation happens in `manifest`
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The base image is pinned in the Dockerfile (FROM ghcr.io/home-assistant/base:<tag>, a
      # multi-arch image), so no BUILD_FROM build-arg / build.yaml is needed — the builder picks
      # the right platform per matrix arch.
      - name: Build image
        id: build
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a  # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
          # Disable the builder's keyless Cosign signing. It defaults on and needs
          # `id-token: write`, which this job deliberately does NOT grant (provenance is attested
          # in the `manifest` job, the single source of image verification). Left enabled it
          # fails `cosign sign` with `expired_token` and takes the whole release down.
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./alpine_a290"
          image: ${{ matrix.image }}
          # Only the immutable version tag — no mutable `latest`. A mid-matrix failure would
          # leave `latest` pointing at mixed-version arches; Supervisor resolves the add-on
          # image by config.yaml `version`, never by `latest`.
          image-tags: |
            ${{ needs.prepare.outputs.version }}
          labels: |
            io.hass.type=addon
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          # Per-arch images are pushed only from a tag run. Users pull the manifest, which
          # `manifest` publishes after the pilot, scan and CI pass, so these are not yet a
          # release. A re-run reuses an existing version tag, so scan and attest see the same
          # bytes rather than a rebuild.
          load: ${{ needs.prepare.outputs.publish != 'true' }}
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          skip-existing: ${{ needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.version || '' }}
          version: ${{ needs.prepare.outputs.version }}

      # The image is the release. Scan the pushed digest, or the locally loaded image on a
      # dry run, before any user-facing version tag exists.
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.76.0

      - name: Trivy image scan (vulns)
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            amd64) platform="linux/amd64" ;;
            aarch64) platform="linux/arm64" ;;
            *) echo "::error::unsupported arch ${ARCH}"; exit 1 ;;
          esac
          if [[ "$PUBLISH" == "true" ]]; then
            raw="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --raw)"
            [[ -n "$raw" ]] || { echo "::error::no pushed image for ${IMAGE}:${VERSION}"; exit 1; }
            ref="${IMAGE}@sha256:$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
          else
            ref="${IMAGE}:${VERSION}"
          fi
          echo "Scanning ${ref}"
          trivy image --platform "$platform" --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$ref"

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build, pilot, validated]
    # The user-facing image: only after every leg booted and CI plus the UI gate passed.
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # OIDC token for keyless build-provenance attestation
      packages: write      # push the multi-arch manifest + the attestation to GHCR
      attestations: write  # publish the build-provenance attestation
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Stage the index under a scratch tag so its digest exists before the version tag.
      # The scratch tag is a second name for the same bytes; the Supervisor never pulls it.
      - name: Stage the multi-arch manifest
        id: stage
        env:
          ARCHITECTURES: ${{ needs.prepare.outputs.architectures }}
          REGISTRY_PREFIX: ${{ needs.prepare.outputs.registry_prefix }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sources=()
          for arch in $(jq -r '.[]' <<< "$ARCHITECTURES"); do
            sources+=("${REGISTRY_PREFIX}/${arch}-${IMAGE_NAME}:${VERSION}")
          done
          staging="${REGISTRY_PREFIX}/${IMAGE_NAME}:staging-${VERSION}"
          docker buildx imagetools create --tag "$staging" "${sources[@]}"
          raw="$(docker buildx imagetools inspect "$staging" --raw)"
          [[ -n "$raw" ]] || { echo "::error::staged manifest has no content"; exit 1; }
          digest="sha256:$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest ${digest}"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "::notice::Staged ${staging} -> ${digest}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}
          subject-digest: ${{ steps.stage.outputs.digest }}
          push-to-registry: true

      # Copy the attested index, not a new one, so the version tag names the attested digest.
      - name: Publish the version tag
        env:
          IMAGE: ${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" "${IMAGE}@${DIGEST}" --prefer-index=false
          raw="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --raw)"
          final="sha256:$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
          [[ "$final" == "$DIGEST" ]] || {
            echo "::error::${IMAGE}:${VERSION} is ${final}, attested ${DIGEST}"; exit 1; }
          echo "::notice::Published ${IMAGE}:${VERSION} as ${DIGEST}"

  pilot:
    name: Published image (${{ matrix.arch }}, Core ${{ matrix.core }})
    needs: [prepare, build]
    # The per-arch image the tag run just pushed is booted under a real stable
    # Supervisor, both arches and both Core ends, before the manifest users pull is published.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.pilot_matrix) }}
    env:
      CORE_VERSION: ${{ matrix.core }}
      PILOT_KEEP: "1"
      PILOT_IMAGE: ${{ matrix.image }}:${{ needs.prepare.outputs.version }}
      # Condition on the steps, not the job: a false job-level `if:` stops the
      # matrix expanding, so the legs report under an unexpanded template name
      # (ui-tests.yaml).
      PILOT_RUN: ${{ needs.prepare.outputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.PILOT_RUN == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the pushed per-arch image under the stable Supervisor
        if: env.PILOT_RUN == 'true'
        env:
          PILOT_WORKDIR: ${{ runner.temp }}/pilot
        run: scripts/supervisor-pilot.sh all

      - name: Collect diagnostics
        if: failure() && env.PILOT_RUN == 'true'
        env:
          PILOT_WORKDIR: ${{ runner.temp }}/pilot
        run: scripts/supervisor-pilot.sh diagnostics "$PILOT_WORKDIR/diagnostics"

      - name: Upload diagnostics
        if: failure() && env.PILOT_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-pilot-${{ matrix.arch }}-${{ matrix.core }}
          path: ${{ runner.temp }}/pilot/diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always() && env.PILOT_RUN == 'true'
        run: scripts/supervisor-pilot.sh down

  validated:
    name: Wait for CI + UI Tests on this commit
    # Gates `manifest`, the image users pull, on CI and the UI gate for the tagged commit.
    needs: [prepare]
    if: ${{ github.event_name == 'push' && needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for UI Tests (both legs; always reports, applicable or not)
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994  # v1.9.1
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: "Wait for CI + UI Tests on this commit"
          check-regexp: '^Dashboard responsive render'
          wait-interval: 20
          checks-discovery-timeout: 180

      - name: Wait for CI's required jobs on this commit
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994  # v1.9.1
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: "Wait for CI + UI Tests on this commit"
          check-regexp: '^(Lint|Tests|Security|Build \(amd64 sanity\)|Docs sync)$'
          wait-interval: 20
          checks-discovery-timeout: 180

  release:
    name: Cut the GitHub Release
    needs: [prepare, manifest]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - name: Create the Release when new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, nothing to do."
            exit 0
          fi
          gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" \
            --notes "Multi-arch image published: \`${IMAGE}:${VERSION}\`, build provenance attested (keyless, GitHub OIDC) and pushed to the registry. Verify: \`gh attestation verify oci://${IMAGE}:${VERSION} --owner MatthewHobbs\`."
