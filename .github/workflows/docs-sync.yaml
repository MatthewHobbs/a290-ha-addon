---
name: Docs sync

# Enforce the CLAUDE.md documentation rules instead of trusting them: a change to the add-on
# options, the published entities, or the version must bring its documentation with it. These
# were checklist items, not checks, so they drifted — `stale_hours` was documented as "without a
# successful poll" long after the option stopped meaning that, and it was only caught by reading
# the docs during an unrelated fix (v1.24.0).
#
# Make this a REQUIRED status check in branch protection so it actually gates. NOTE: do NOT use
# `just repo-protect --apply` to do that — it resolves the repo from the working directory but
# hard-codes contexts: ["shell-gate"], so running it here would WIPE this repo's real required
# checks. Set the context with a targeted API call that preserves the existing list.
#
# Wave a genuinely documentation-neutral change through with the `docs-sync-ok` PR label.

on:
  pull_request:
    # labeled/unlabeled included so adding (or removing) the `docs-sync-ok` waiver re-runs the
    # check — otherwise a red required check stays red until an unrelated push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  docs-sync:
    name: Docs sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # the check diffs base...HEAD and reads the base tree
      - name: Documentation must track options, entities and version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/docs_sync_check.py "$BASE_SHA"
