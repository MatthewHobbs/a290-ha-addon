# Dependabot: runtime Python (hash-locked), GitHub Actions, and the Dockerfile's
# builder images. What no manifest describes is bumped by hand: CORE_REF, the UI
# gate's HA image and cards, the pilot's image digests, and CI tools pinned inline.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/alpine_a290/app"
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/London
    groups:
      # Its own PR: it changes what the car exposes (see test_api_contract.py's endpoint map).
      renault-api:
        patterns: ["renault-api"]
      python:
        patterns: ["*"]
        exclude-patterns: ["renault-api"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/London
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/alpine_a290"
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/London
    groups:
      images:
        patterns: ["*"]
