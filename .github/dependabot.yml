# Dependabot — Python only. GitHub Actions, the Dockerfile images, and the CORE_REF core pin
# moved to Renovate (.github/renovate.json), which can see the SHA pin that no manifest declares.
#
# Python stays here: requirements.txt is a hash-locked pip-compile output installed with
# --require-hashes, and Dependabot understands the requirements.in/.txt pair. renault-api is
# deliberately NOT auto-updated: per-model endpoint support is hard-coded in the library
# (see CLAUDE.md), so it is bumped manually after a docker-verified review.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/alpine_a290/app"
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/London
    ignore:
      - dependency-name: renault-api
    groups:
      python:
        patterns: ["*"]
